{% assign project = include.project %}
<article class="feature-card research-feature-card">
  <a class="feature-card__media feature-card__media--{{ project.media_style | default: 'figure' }}" href="{{ project.url | relative_url }}" aria-label="Read about {{ project.title }}">
    {% if project.image %}
      <img src="{{ project.image | relative_url }}" alt="{{ project.image_alt | default: project.title }}" loading="lazy">
    {% elsif project.video %}
      <video autoplay loop muted playsinline preload="metadata" aria-label="{{ project.video_alt | default: project.title }}">
        <source src="{{ project.video | relative_url }}" type="{{ project.video_type | default: 'video/mp4' }}">
      </video>
    {% endif %}
  </a>

  <div class="feature-card__body">
    <p class="feature-card__kicker">{{ project.label | default: 'Research' }}</p>
    <h3><a href="{{ project.url | relative_url }}">{{ project.title }}</a></h3>
    <p class="feature-card__summary">{{ project.summary }}</p>
  </div>
</article>
