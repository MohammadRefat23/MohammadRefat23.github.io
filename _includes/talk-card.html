{% assign talk = include.talk %}
<article class="feature-card talk-feature-card">
  <a class="feature-card__media feature-card__media--cover" href="{{ talk.url | relative_url }}" aria-label="View {{ talk.title }}">
    {% if talk.thumbnail %}
      <img src="{{ talk.thumbnail }}" alt="Video thumbnail for {{ talk.title }}" loading="lazy">
    {% else %}
      <div class="feature-card__placeholder" aria-hidden="true"><i class="fas fa-play"></i></div>
    {% endif %}
    <span class="play-badge" aria-hidden="true"><i class="fas fa-play"></i></span>
  </a>

  <div class="feature-card__body">
    <p class="feature-card__kicker">Recorded talk</p>
    <h3><a href="{{ talk.url | relative_url }}">{{ talk.title }}</a></h3>
    <p class="feature-card__summary">{{ talk.excerpt }}</p>

    <div class="feature-card__meta">
      <img class="feature-card__avatar" src="{{ '/images/profile.png' | relative_url }}" alt="" aria-hidden="true">
      <div class="feature-card__meta-copy">
        <strong>{{ site.author.name }}</strong><br>
        {{ talk.event | default: talk.venue }} · {{ talk.date | date: '%Y' }}
      </div>
    </div>

    <div class="feature-card__footer">
      <a class="text-link" href="{{ talk.url | relative_url }}">Read more <span aria-hidden="true">→</span></a>
    </div>
  </div>
</article>
