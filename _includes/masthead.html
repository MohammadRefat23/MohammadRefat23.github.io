<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="site-nav-static" aria-label="Primary navigation">
        <a class="site-brand{% if page.url == '/' %} active{% endif %}"
           href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>
          M. Refat
        </a>

        <div class="site-nav-links">
          {% for link in site.data.navigation.main %}
            <a class="site-nav-link{% if page.url == link.url %} active{% endif %}"
               href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>
              {{ link.title }}
            </a>
          {% endfor %}
        </div>
      </nav>
    </div>
  </div>
</div>
