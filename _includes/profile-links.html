<nav class="profile-links" aria-label="Academic and professional profiles">

  {% if site.author.email %}
    <a class="profile-link" href="mailto:{{ site.author.email }}">
      Email
    </a>
  {% endif %}

  {% if site.author.googlescholar %}
    <a class="profile-link"
       href="{{ site.author.googlescholar }}"
       target="_blank"
       rel="noopener">
      Google Scholar
    </a>
  {% endif %}

  {% if site.author.orcid %}
    <a class="profile-link"
       href="{{ site.author.orcid }}"
       target="_blank"
       rel="noopener">
      ORCID
    </a>
  {% endif %}

  {% if site.author.github %}
    <a class="profile-link"
       href="https://github.com/{{ site.author.github }}"
       target="_blank"
       rel="noopener">
      GitHub
    </a>
  {% endif %}

  {% if site.author.linkedin %}
    <a class="profile-link"
       href="https://www.linkedin.com/in/{{ site.author.linkedin }}"
       target="_blank"
       rel="noopener">
      LinkedIn
    </a>
  {% endif %}

  {% if site.author.youtube %}
    <a class="profile-link"
       href="https://www.youtube.com/@{{ site.author.youtube }}"
       target="_blank"
       rel="noopener">
      YouTube
    </a>
  {% endif %}

</nav>
