<nav class="profile-socials" aria-label="Academic and professional profiles">
  {% if site.author.email %}
    <a href="mailto:{{ site.author.email }}" aria-label="Email" title="Email">
      <i class="fas fa-envelope" aria-hidden="true"></i>
    </a>
  {% endif %}

  {% if site.author.googlescholar %}
    <a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar" title="Google Scholar">
      <i class="ai ai-google-scholar" aria-hidden="true"></i>
    </a>
  {% endif %}

  {% if site.author.orcid %}
    <a href="{{ site.author.orcid }}" target="_blank" rel="noopener noreferrer" aria-label="ORCID" title="ORCID">
      <i class="ai ai-orcid" aria-hidden="true"></i>
    </a>
  {% endif %}

  {% if site.author.github %}
    <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
      <i class="fab fa-github" aria-hidden="true"></i>
    </a>
  {% endif %}

  {% if site.author.linkedin %}
    <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
      <i class="fab fa-linkedin-in" aria-hidden="true"></i>
    </a>
  {% endif %}

  {% if site.author.youtube %}
    <a href="https://www.youtube.com/@{{ site.author.youtube }}" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
      <i class="fab fa-youtube" aria-hidden="true"></i>
    </a>
  {% endif %}
</nav>
