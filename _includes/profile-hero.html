<section class="profile-hero">
  <div class="profile-portrait-wrap">
    <img class="profile-portrait" src="{{ '/images/profile.png' | relative_url }}" alt="Portrait of {{ site.author.name }}">
  </div>

  <div class="profile-intro">
    <h1>{{ site.author.name }}</h1>
    <p class="profile-role">{{ site.author.bio }}</p>
    {% if site.author.employer %}
      <p class="profile-affiliation">{{ site.author.employer }}</p>
    {% endif %}

    {% include social-links.html %}
    {% include bio-copy.html %}

    <div class="profile-actions">
      <a class="site-button site-button--primary" href="{{ '/assets/cv/cv.pdf' | relative_url }}" target="_blank" rel="noopener">Download CV</a>
      {% unless page.permalink == '/bio/' %}
        <a class="site-button site-button--ghost" href="{{ '/bio/' | relative_url }}">Full bio</a>
      {% endunless %}
    </div>
  </div>
</section>
