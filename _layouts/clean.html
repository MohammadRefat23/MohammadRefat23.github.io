---
layout: default
---

<main id="main" class="site-main" role="main">
  <div class="content-shell{% if page.wide %} content-shell--wide{% endif %}">
    {% unless page.hide_title or page.title == '' %}
      <header class="page-header">
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p>{{ page.description }}</p>{% endif %}
      </header>
    {% endunless %}

    <div class="page-content">
      {{ content }}
    </div>
  </div>
</main>
