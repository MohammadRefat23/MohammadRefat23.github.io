# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: indigo

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Personal website of Mohammad Alvi Refat, a computational physicist working on inverse problems, scientific computing, statistical inference, and data-driven physical modeling.'
    twitter: ''
  analytics:
    google_analytics: 'G-6PKL83GG52'
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
    goatcounter: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: false
    show_theme_chooser: false
    logo:
      text: 'M. Refat'

# Site footer
footer:
  copyright:
    notice: '© {year} Mohammad Alvi Refat'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
  share:
    enable: false
