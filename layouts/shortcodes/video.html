{{- $src := .Get "src" | relURL -}}
<div class="site-video-embed">
  <video autoplay muted loop playsinline controls preload="metadata">
    <source src="{{ $src }}" type="video/mp4">
    Your browser does not support embedded video.
  </video>
</div>

<style>
.site-video-embed {
  max-width: 850px;
  margin: 2rem auto;
}
.site-video-embed video {
  display: block;
  width: 100%;
  border-radius: .8rem;
}
</style>
