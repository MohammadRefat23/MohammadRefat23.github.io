{{- $src := .Get "src" -}}
{{- $title := .Get "title" | default "Curriculum Vitae" -}}

<div class="cv-page-actions">
  <a
    class="cv-download-button"
    href="{{ $src | safeURL }}"
    download
  >
    Download CV
  </a>

  <a
    class="cv-open-button"
    href="{{ $src | safeURL }}"
    target="_blank"
    rel="noopener"
  >
    Open PDF in New Tab
  </a>
</div>

<div class="cv-pdf-viewer">
  <iframe
    src="{{ $src | safeURL }}#view=FitH"
    title="{{ $title }}"
    loading="lazy"
  ></iframe>
</div>

<style>
  .cv-page-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin: 0 0 1.5rem;
  }

  .cv-download-button,
  .cv-open-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.7rem 1.1rem;
    border-radius: 0.5rem;
    font-weight: 600;
    text-decoration: none;
  }

  .cv-download-button {
    color: white;
    background: var(--color-primary-600, #2563eb);
  }

  .cv-open-button {
    border: 1px solid currentColor;
  }

  .cv-pdf-viewer {
    width: 100%;
    height: min(82vh, 1100px);
    min-height: 650px;
    overflow: hidden;
    border: 1px solid rgba(127, 127, 127, 0.35);
    border-radius: 0.5rem;
    background: white;
  }

  .cv-pdf-viewer iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  @media (max-width: 640px) {
    .cv-pdf-viewer {
      height: 72vh;
      min-height: 500px;
    }
  }
</style>
