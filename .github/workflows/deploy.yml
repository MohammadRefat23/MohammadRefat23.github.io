name: Build CV and Hugo Site

env:
  HUGO_VERSION: "0.152.2"
  NODE_VERSION: "20"

on:
  push:
    branches:
      - main
      - hugo-migration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout CV repository
        uses: actions/checkout@v6
        with:
          repository: MohammadRefat23/cv
          ref: main
          path: external-cv

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install site dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          working_directory: external-cv
          os: debian

      - name: Copy CV into Hugo static files
        run: |
          mkdir -p static/uploads
          cp external-cv/cv.pdf static/uploads/Mohammad_Refat_CV.pdf

          if [ ! -s static/uploads/Mohammad_Refat_CV.pdf ]; then
            echo "CV PDF was not created correctly."
            exit 1
          fi

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
          else
            hugo --minify
          fi

      - name: Verify deployed CV
        run: |
          test -s public/uploads/Mohammad_Refat_CV.pdf
          echo "CV is included in the Hugo build."

      - name: Generate Pagefind index
        run: pnpm dlx pagefind --site public

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
