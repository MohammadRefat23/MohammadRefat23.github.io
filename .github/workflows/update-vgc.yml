name: Update VGC Data

on:
  schedule:
    # Run at 12:00 UTC on the first day of every month
    - cron: "0 12 1 * *"

  # Lets you test it manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install updater dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Update competitive Doubles data
        run: |
          python scripts/update_vgc_meta.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- static/data/vgc-meta.json; then
            echo "VGC data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email 
"41898282+github-actions[bot]@users.noreply.github.com"

          git add static/data/vgc-meta.json
          git commit -m "Update monthly VGC metagame data"
          git push
