name: Update VGC Data

on:
  schedule:
    # First day of every month at 12:17 UTC
    - cron: "17 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install updater dependencies
        run: python -m pip install requests

      - name: Update competitive Doubles data
        run: python scripts/update_vgc_meta.py

      - name: Commit updated data
        id: commit
        run: |
          if git diff --quiet -- static/data/vgc-meta.json; then
            echo "VGC data has not changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/data/vgc-meta.json
          git commit -m "Update monthly VGC metagame data"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild and deploy website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main